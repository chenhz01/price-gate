name: price-gate
description: Your cost model is only as good as the price table under it.
branding:
  icon: shield
  color: blue
inputs:
  args:
    description: Arguments passed to gate.py
    required: false
    default: "--help"
runs:
  using: composite
  steps:
    - shell: bash
      run: python "${{ github.action_path }}/gate.py" ${{ inputs.args }}
